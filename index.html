<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neawe</title>
<link rel="canonical" href="https://neawe.com/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://neawe.com/">
<meta property="og:title" content="Neawe">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300&family=Spectral:wght@300&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:   #0e1219;
    --lamp:  #171d27;
    --paper: #e9e3d6;
    --muted: #8b8574;
    --brass: #c08a3e;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--ink);
    background-image: radial-gradient(60rem 40rem at 50% 38%, var(--lamp) 0%, var(--ink) 70%);
    color: var(--paper);
    font-family: "Spectral", Georgia, serif;
    font-weight: 300;
    display: grid;
    place-items: center;
    padding: 3rem 1.5rem;
    -webkit-font-smoothing: antialiased;
  }

  main {
    text-align: center;
    animation: rise 900ms ease-out both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(0.75rem); }
    to   { opacity: 1; transform: none; }
  }

  .wordmark {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 300;
    font-size: clamp(3.2rem, 14vw, 6rem);
    line-height: 1;
    letter-spacing: 0.01em;
    margin: 0;
  }

  /* Asterism - the printer's mark for a pause between passages. */
  .asterism {
    color: var(--brass);
    font-size: 1.4rem;
    line-height: 1;
    margin: 2.25rem 0;
    user-select: none;
  }

  .status {
    font-size: 0.8125rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    main { animation: none; }
  }
</style>
</head>
<body>
  <main>
    <h1 class="wordmark">Neawe</h1>
    <div class="asterism" aria-hidden="true">&#8258;</div>
    <p class="status">Coming soon</p>
  </main>
</body>
</html>
